# ==============================
# DATASOURCE CONFIGURATION
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/gawt_db
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-binding-errors=always
# ==============================
# SERVER CONFIGURATION
# ==============================
server.port=8081
server.address=0.0.0.0

brevo.api-key=${BREVO_API_KEY}

# ==============================f
# JWT CONFIG
# ==============================
bezkoder.app.jwtSecret= ======================BezKoder=Spring===========================
bezkoder.app.jwtExpirationMs=86400000


# ==============================
# OTP CONFIGURATION
# ==============================
otp.expiry.minutes=10
otp.length=6


# ==============================
# FILE UPLOADS (item photos + chat photos, 5MB each)
# ==============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# ==============================
# CHAT
# ==============================
# Photos allowed per conversation (both users combined). 1 photo per message.
chat.max-images-per-conversation=10

