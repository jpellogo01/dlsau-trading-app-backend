# =====================================================================
# GAWT backend configuration
#
# NO SECRETS IN THIS FILE - it is committed to git.
# - Production (Railway): every secret comes from an environment variable.
# - Local development: put your secrets in application-local.properties
#   (same folder, git-ignored). See application-local.properties.example.
# Environment variables always win over both files.
# =====================================================================

# Local secrets file (ignored if it does not exist, e.g. on Railway)
spring.config.import=optional:classpath:application-local.properties

# ==============================
# DATABASE
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gawt_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-binding-errors=always

# ==============================
# SERVER
# ==============================
# Railway/other hosts provide PORT; locally it stays 8081.
server.port=${PORT:8081}
server.address=0.0.0.0

# Browser origins allowed to call the API and open the chat WebSocket
# (comma-separated, * wildcards allowed). In production set e.g.
# APP_CORS_ORIGINS=https://your-domain.com,https://www.your-domain.com
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173}

# ==============================
# EMAIL (Brevo) - OTP emails
# ==============================
brevo.api-key=${BREVO_API_KEY}
# Must be a sender/domain verified in your Brevo account
brevo.sender-email=${BREVO_SENDER_EMAIL:no-reply@dlsauwebtube.com}

# ==============================
# JWT
# ==============================
# Secret: JWT_SECRET env var (production) or bezkoder.app.jwtSecret in
# application-local.properties (local). At least 32 characters.
bezkoder.app.jwtExpirationMs=86400000

# ==============================
# OTP
# ==============================
otp.expiry.minutes=10
otp.length=6

# ==============================
# FILE UPLOADS (item photos + chat photos, 5MB each)
# ==============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# ==============================
# CHAT
# ==============================
# Photos allowed per conversation (both users combined). 1 photo per message.
chat.max-images-per-conversation=10

# ==============================
# CLOUDINARY (image uploads)
# ==============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
